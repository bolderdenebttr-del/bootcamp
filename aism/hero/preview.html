<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Montserrat,sans-serif}
  .hero{min-height:100vh;display:flex;align-items:center;padding:0 7vw;color:#F1ECE2;

  @media (max-width:720px){
    .hero{background-image:image-set(url(out/aism-hero-ink-mobile.webp) type("image/webp"), url(out/aism-hero-ink-mobile.jpg) type("image/jpeg"))}
